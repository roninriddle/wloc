name: Sync WLOC Core

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: wloc-core-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: zxishere/wloc

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout self-hosted repo
        uses: actions/checkout@v4

      - name: Fetch maintained upstream
        run: |
          rm -rf /tmp/wloc-upstream
          git clone --depth 1 "https://github.com/${UPSTREAM_REPO}.git" /tmp/wloc-upstream

      - name: Validate upstream core files
        run: |
          test -s /tmp/wloc-upstream/wloc.js
          test -s /tmp/wloc-upstream/wloc-settings.js
          grep -q 'wloc' /tmp/wloc-upstream/wloc.js
          grep -q 'wloc_settings' /tmp/wloc-upstream/wloc-settings.js

      - name: Sync core scripts only
        run: |
          cp /tmp/wloc-upstream/wloc.js ./wloc.js
          cp /tmp/wloc-upstream/wloc-settings.js ./wloc-settings.js

          UPSTREAM_SHA="$(git -C /tmp/wloc-upstream rev-parse HEAD)"
          SYNCED_AT="$(date -u +%F)"
          cat > upstream-version.json <<EOF
          {
            "repository": "${UPSTREAM_REPO}",
            "commit": "${UPSTREAM_SHA}",
            "syncedAt": "${SYNCED_AT}"
          }
          EOF

      - name: Preserve self-hosted custom layer
        run: |
          test -s ./index.html
          test -s ./wloc.sgmodule
          test -s ./manifest.json
          test -s ./sw.js
          grep -q 'roninriddle/wloc/main/wloc.js' ./wloc.sgmodule
          grep -q 'roninriddle/wloc/main/wloc-settings.js' ./wloc.sgmodule

      - name: Commit synchronized core
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wloc.js wloc-settings.js upstream-version.json
          if git diff --cached --quiet; then
            echo 'Core scripts already up to date.'
          else
            git commit -m 'sync: update WLOC core scripts'
            git push
          fi
